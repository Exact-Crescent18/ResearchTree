<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laughder CMS - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --dark-bg: #0f172a; 
            --card-bg: #1e293b;
            --border-color: #334155;
            --accent-mint: #00ff88;
            --accent-mint-dark: #00cc6a;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--dark-bg); color: #f8fafc; }
        .form-input-glass { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); color: white; border-radius: 0.5rem; transition: all 0.3s ease; }
        .form-input-glass:focus { outline: none; border-color: var(--accent-mint); box-shadow: 0 0 0 2px rgba(0, 255, 136, 0.2); }
        .btn-primary { background: linear-gradient(135deg, var(--accent-mint), var(--accent-mint-dark)); color: #000; font-weight: bold; transition: all 0.3s ease; cursor: pointer; }
        .btn-primary:hover { box-shadow: 0 0 15px rgba(0, 255, 136, 0.4); transform: translateY(-1px); }
        .btn-secondary { background: #334155; color: white; transition: all 0.3s ease; cursor: pointer; }
        .btn-secondary:hover { background: #475569; }
        .sidebar-item { display: block; width: 100%; text-align: left; padding: 12px 16px; margin-bottom: 8px; border-radius: 8px; transition: all 0.2s; cursor: pointer; }
        .sidebar-item:hover { background: rgba(255,255,255,0.05); }
        .sidebar-item.active { background-color: rgba(0, 255, 136, 0.1); color: var(--accent-mint); border-right: 3px solid var(--accent-mint); }
        .toast { background: #1e293b; border-left: 4px solid var(--accent-mint); color: white; padding: 16px 24px; border-radius: 0.5rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); margin-bottom: 12px; opacity: 0; transform: translateX(100%); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .toast.error { border-left-color: #ef4444; }
        .toast.show { opacity: 1; transform: translateX(0); }
    </style>
</head>
<body class="antialiased h-screen flex">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-[#0b1120]">
        <div class="bg-[#1e293b] p-10 rounded-2xl border border-gray-800 w-full max-w-md shadow-2xl mx-4">
            <h1 class="text-3xl font-black text-white mb-2 text-center">Laughder CMS</h1>
            <p class="text-gray-400 text-center mb-6 text-sm">Authorized Personnel Only</p>
            <form id="login-form" class="space-y-5">
                <input type="email" id="login-email" required class="form-input-glass w-full p-3" placeholder="Email">
                <input type="password" id="login-password" required class="form-input-glass w-full p-3" placeholder="Password">
                <button type="submit" class="w-full btn-primary px-6 py-3 rounded-lg">Secure Login</button>
            </form>
        </div>
    </div>

    <!-- APP CONTAINER -->
    <div id="app-container" class="hidden w-full h-full flex">
        <aside class="w-64 bg-[#0f172a] border-r border-gray-800 flex flex-col p-6">
            <h2 class="text-2xl font-black text-white mb-8">Laughder<span class="text-[var(--accent-mint)]">.</span></h2>
            
            <nav class="flex-1 space-y-2">
                <button class="sidebar-item active">Dashboard</button>
                <button class="sidebar-item">Comedians</button>
                <button class="sidebar-item">Venues</button>
            </nav>

            <div class="border-t border-gray-800 pt-4 mt-4 space-y-3">
                <button onclick="importFromTicketmaster()" class="w-full btn-secondary px-4 py-3 rounded-lg text-sm font-bold flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Sync Ticketmaster
                </button>
                <button onclick="logout()" class="w-full bg-red-900/30 text-red-400 hover:bg-red-900/50 px-4 py-2 rounded-lg text-sm font-bold transition-colors">Sign Out</button>
            </div>
        </aside>
        
        <main class="flex-1 p-8 overflow-y-auto">
            <header class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold text-white">Admin Overview</h2>
            </header>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-[#1e293b] p-6 rounded-xl border border-gray-800">
                    <h3 class="text-gray-400 font-medium mb-1">Total Comedians</h3>
                    <p class="text-3xl font-bold text-white" id="stat-comedians">--</p>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container" class="fixed top-5 right-5 z-[200]"></div>

    <script>
        const supabaseUrl = 'https://lapwxjyqjecuqpcirxxo.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhcHd4anlxamVjdXFwY2lyeHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMjg0NTQsImV4cCI6MjA5NjYwNDQ1NH0.V5QysD6p6lztmjpFfA1JZ-1aez14znjZWP42c9lGbPk';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // Check for existing session on page load
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                verifyAdminStatus(session.user.id);
            }
        }
        
        checkSession();

        // Login Submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({ email, password });
                if (authError) throw authError;

                await verifyAdminStatus(authData.user.id);
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        // Strict Admin Verification Function
        async function verifyAdminStatus(userId) {
            try {
                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', userId)
                    .single();

                // Log the error to the console for easier debugging
                if (profileError) {
                    console.error("Profile Fetch Error:", profileError);
                    await supabase.auth.signOut();
                    
                    if (profileError.code === 'PGRST116') {
                        throw new Error("No profile found! You must manually insert a row in the 'profiles' table with your user ID (UUID).");
                    }
                    
                    throw new Error("Error checking admin status: " + profileError.message);
                }

                // If error occurs (like row doesn't exist) or role isn't explicitly admin
                if (!profile || !profile.role || profile.role.toLowerCase() !== 'admin') {
                    console.warn("User Profile Data:", profile);
                    await supabase.auth.signOut();
                    throw new Error(`Access Denied: Your account role is '${profile?.role || 'undefined'}', not 'admin'. Please check the database.`);
                }

                // Success!
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                showToast('Welcome to the dashboard!');

            } catch (error) {
                showToast(error.message, 'error');
                await supabase.auth.signOut();
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }

        // TICKETMASTER SYNC LOGIC
        async function importFromTicketmaster() {
            const apiKey = prompt("Enter your Ticketmaster Consumer API Key:");
            if (!apiKey) return;

            showToast("Contacting Ticketmaster API...", "success");

            try {
                // Fetch Comedy Events/Attractions
                const response = await fetch(`https://app.ticketmaster.com/discovery/v2/attractions.json?classificationName=Comedy&apikey=${apiKey}&size=50`);
                
                if (!response.ok) throw new Error("Failed to authenticate with Ticketmaster. Check your API key.");
                
                const data = await response.json();
                const attractions = data._embedded?.attractions || [];
                
                if (attractions.length === 0) {
                    showToast("No comedians found.", "error");
                    return;
                }

                showToast(`Found ${attractions.length} comedians! Saving to database...`, "success");

                // Map Ticketmaster data to match our database structure
                const formattedData = attractions.map(comedian => {
                    // Find the best quality image
                    const bestImage = comedian.images?.sort((a, b) => b.width - a.width)[0]?.url || '';
                    return {
                        tm_id: comedian.id,
                        name: comedian.name,
                        image_url: bestImage
                    };
                });

                // Upsert to Supabase (Insert new, update existing based on tm_id)
                const { error } = await supabase
                    .from('comedians')
                    .upsert(formattedData, { onConflict: 'tm_id' });

                if (error) {
                    // If the table doesn't exist, provide a helpful error
                    if (error.code === '42P01') {
                        throw new Error("The 'comedians' table does not exist in Supabase yet. Please check the Guide.");
                    }
                    throw error;
                }

                showToast(`Successfully synced ${formattedData.length} comedians!`, "success");
                document.getElementById('stat-comedians').innerText = formattedData.length;

            } catch (error) {
                console.error(error);
                showToast(error.message, "error");
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
        }
    </script>
</body>
</html>
